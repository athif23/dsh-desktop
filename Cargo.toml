[package]
name = "dsh-desktop"
version = "0.1.0"
edition = "2021"
description = "Boring Tauri v2 shell: spawns upstream `dsh web`, shows it in system WebView2. No DSH fork, no browser logic here."
license = "MIT"

[dependencies]
tauri = { version = "2", features = ["unstable"] }
tauri-plugin-dialog = "2"
url = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
webview2-com = "0.38"
windows = { version = "0.61", features = ["Win32_Foundation"] }

[build-dependencies]
tauri-build = { version = "2", features = [] }

[profile.release]
lto = true
codegen-units = 1
